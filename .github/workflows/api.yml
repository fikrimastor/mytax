name: API and database security tests
on:
  push:
  pull_request:
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-postgres-only
          POSTGRES_DB: mytax_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mytax_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
      - name: Provision isolated two-tenant fixture
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: ci-postgres-only
          PGDATABASE: mytax_ci
        run: psql -X -v ON_ERROR_STOP=1 -f testdata/security_fixture.sql
      - name: Start disposable Keycloak (synthetic realm, test only)
        working-directory: .
        run: |
          docker compose -f docker-compose.keycloak.yml up -d
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null http://localhost:8081/realms/mytax-ci/.well-known/openid-configuration; then
              echo "Keycloak realm mytax-ci ready after ~$((i*3))s"; exit 0
            fi
            sleep 3
          done
          echo "Keycloak did not become ready" >&2
          docker compose -f docker-compose.keycloak.yml logs --no-color keycloak | tail -80
          exit 1
      - name: Unit, PostgreSQL RLS and live Keycloak tests
        env:
          MYTAX_TEST_DATABASE_URL: postgres://mytax_app:ci-only-insecure-password@localhost:5432/mytax_ci?sslmode=disable
          MYTAX_TEST_ADMIN_DATABASE_URL: postgres://postgres:ci-postgres-only@localhost:5432/mytax_ci?sslmode=disable
          MYTAX_TEST_TENANT_A: 11111111-1111-4111-8111-111111111111
          MYTAX_TEST_TENANT_B: 22222222-2222-4222-8222-222222222222
          MYTAX_TEST_KEYCLOAK_ISSUER: http://localhost:8081/realms/mytax-ci
          MYTAX_TEST_KEYCLOAK_ADMIN_USER: ci-admin
          MYTAX_TEST_KEYCLOAK_ADMIN_PASSWORD: ci-only-admin-pw
        run: |
          # A skipped security test is NOT a pass: every gate variable must be set.
          for v in MYTAX_TEST_DATABASE_URL MYTAX_TEST_ADMIN_DATABASE_URL MYTAX_TEST_TENANT_A MYTAX_TEST_TENANT_B \
                   MYTAX_TEST_KEYCLOAK_ISSUER MYTAX_TEST_KEYCLOAK_ADMIN_USER MYTAX_TEST_KEYCLOAK_ADMIN_PASSWORD; do
            test -n "${!v}" || { echo "$v is empty; refusing to run security gates without it" >&2; exit 1; }
          done
          go mod tidy
          set -o pipefail
          log="$RUNNER_TEMP/go-test.log"
          go test -count=1 -v ./... 2>&1 | tee "$log"
          if grep -q -- '--- SKIP' "$log"; then
            echo "Tests were skipped; skipped tests are not proof of passing:" >&2
            grep -- '--- SKIP' "$log" >&2
            exit 1
          fi
      - name: Keycloak logs on failure
        if: failure()
        working-directory: .
        run: docker compose -f docker-compose.keycloak.yml logs --no-color keycloak | tail -120
      - name: Stop Keycloak
        if: always()
        working-directory: .
        run: docker compose -f docker-compose.keycloak.yml down -v
