name: API and database security tests
on:
  push:
  pull_request:
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-postgres-only
          POSTGRES_DB: mytax_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mytax_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
      - name: Provision isolated two-tenant fixture
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: ci-postgres-only
          PGDATABASE: mytax_ci
        run: psql -X -v ON_ERROR_STOP=1 -f testdata/security_fixture.sql
      - name: Start Keycloak with self-signed TLS
        run: |
          certs="$RUNNER_TEMP/kc-certs"; mkdir -p "$certs"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost,IP:127.0.0.1" \
            -keyout "$certs/kc.key" -out "$certs/kc.crt"
          chmod 644 "$certs/kc.key" # throwaway CI key; container user must read it
          docker run -d --name keycloak -p 8443:8443 \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=ci -e KC_BOOTSTRAP_ADMIN_PASSWORD=ci-only-admin \
            -v "$certs":/opt/keycloak/certs:ro \
            -v "$GITHUB_WORKSPACE/services/api/testdata/keycloak/realm-mytax.json":/opt/keycloak/data/import/realm-mytax.json:ro \
            quay.io/keycloak/keycloak:26.0 start-dev --import-realm --hostname=https://localhost:8443 \
            --https-certificate-file=/opt/keycloak/certs/kc.crt --https-certificate-key-file=/opt/keycloak/certs/kc.key
          for i in $(seq 1 60); do
            curl -fs --cacert "$certs/kc.crt" https://localhost:8443/realms/mytax/.well-known/openid-configuration >/dev/null && exit 0
            sleep 3
          done
          docker logs keycloak; exit 1
      - name: Unit and mandatory PostgreSQL RLS integration tests
        env:
          MYTAX_TEST_DATABASE_URL: postgres://mytax_app:ci-only-insecure-password@localhost:5432/mytax_ci?sslmode=disable
          MYTAX_TEST_TENANT_A: 11111111-1111-4111-8111-111111111111
          MYTAX_TEST_TENANT_B: 22222222-2222-4222-8222-222222222222
          MYTAX_TEST_KEYCLOAK_ISSUER: https://localhost:8443/realms/mytax
          MYTAX_TEST_KEYCLOAK_CA: ${{ runner.temp }}/kc-certs/kc.crt
        run: |
          test -n "$MYTAX_TEST_DATABASE_URL"
          go mod tidy
          go test -count=1 -v ./...
          go test -count=1 -v -run 'TestLiveKeycloak' ./internal/livekeycloak | tee /tmp/live.log
          grep -q -- '--- PASS: TestLiveKeycloakTokens' /tmp/live.log && grep -q -- '--- PASS: TestLiveKeycloakHTTPAndRLS' /tmp/live.log # fail if skipped
